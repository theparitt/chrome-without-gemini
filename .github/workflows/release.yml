name: Test, build, release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Lint
        run: python -m ruff check .
      - name: Tests (isolated fixtures, no Chrome settings modified)
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python scripts/build.py
      - name: Packaged CLI tests (no real Chrome settings modified)
        run: python scripts/check_cli.py
      - name: Packaged GUI self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/ChromeWithoutGemini.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged GUI self-test failed' }
      - name: Packaged GUI self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/ChromeWithoutGemini.app/Contents/MacOS/ChromeWithoutGemini --self-test
      - name: Packaged GUI self-test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/ChromeWithoutGemini --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist/chrome-without-gemini-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum chrome-without-gemini-* > SHA256SUMS.txt
      - name: Publish executable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --title "Chrome Without Gemini $RELEASE_TAG" --notes-file docs/release-notes.md --verify-tag

